<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; }
    html, body { background: #e2e8f0; }
    .row { display: flex; gap: 16px; padding: 16px; align-items: end; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 12px sans-serif; color: #334155; }
    img { display: block; image-rendering: pixelated; }
    .s16 img { width: 16px; height: 16px; }
    .s32 img { width: 32px; height: 32px; }
    .s64 img { width: 64px; height: 64px; }
    .s128 img { width: 128px; height: 128px; image-rendering: auto; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell s16"><img src="favicon.svg.tmp" width="16" height="16" /><span>16</span></div>
    <div class="cell s32"><img src="favicon.svg.tmp" width="32" height="32" /><span>32</span></div>
    <div class="cell s64"><img src="favicon.svg.tmp" width="64" height="64" /><span>64</span></div>
    <div class="cell s128"><img src="favicon.svg.tmp" width="128" height="128" /><span>128</span></div>
  </div>
</body>
</html>

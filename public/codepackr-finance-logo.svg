<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1274 384" width="1274" height="384" role="img" aria-label="CodePackr Finance Logo">
  <title>CodePackr Finance</title>
  <desc>CodePackr Finance logo with blue growth mark, Codepackr wordmark, green Finance label, and tagline</desc>
  <defs>
    
    <linearGradient id="cf-blue-c-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="35%" stop-color="#0080FF" />
      <stop offset="70%" stop-color="#0055E5" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>
    <linearGradient id="cf-blue-facet-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002D96" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cf-green-bar-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="55%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="cf-green-arrow-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="cf-packr-blue-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="cf-drop-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#070D1B" flood-opacity="0.2" />
    </filter>
  
  </defs>
  <!-- Mark on Left -->
  <g transform="translate(44, 28) scale(0.64)">
    
    <g id="brand-mark-group-light">
      <!-- Outer Blue C ribbon -->
      <path fill="url(#cf-blue-c-light)" d="
        M 372 76
        C 242 42, 138 72, 86 142
        C 40 204, 40 308, 86 370
        C 138 440, 242 470, 352 436
        C 372 430, 376 412, 362 398
        L 318 350
        C 310 342, 298 340, 288 344
        C 230 368, 184 350, 152 312
        C 124 278, 124 234, 152 200
        C 184 162, 230 144, 288 168
        C 298 172, 310 170, 318 162
        L 362 114
        C 376 100, 372 82, 372 76
        Z
      " />

      <!-- Top Arm Depth Facet -->
      <path fill="url(#cf-blue-facet-light)" d="
        M 288 168
        C 298 172, 310 170, 318 162
        L 362 114
        C 372 104, 370 90, 356 84
        C 285 76, 218 114, 182 160
        C 218 144, 255 154, 288 168
        Z
      " />

      <!-- 3 Ascending Green Financial Bars -->
      <rect x="175" y="270" width="38" height="78" rx="8" fill="url(#cf-green-bar-light)" />
      <rect x="230" y="208" width="38" height="140" rx="8" fill="url(#cf-green-bar-light)" />
      <rect x="285" y="144" width="38" height="204" rx="8" fill="url(#cf-green-bar-light)" />

      <!-- Upward Growth Arrow and Curve -->
      <path fill="url(#cf-green-arrow-light)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" d="
        M 120 362
        C 165 400, 235 390, 295 320
        C 330 280, 360 225, 385 170
        L 355 165
        L 426 134
        L 416 208
        L 390 192
        C 368 238, 338 288, 305 326
        C 246 392, 175 402, 126 370
        Z
      " />
    </g>
  
  </g>
  <!-- Brand Wordmark -->
  <text x="420" y="182" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="124" letter-spacing="-3">
    <tspan fill="#0B1220">Code</tspan><tspan fill="url(#cf-packr-blue-light)">packr</tspan>
  </text>
  <!-- FINANCE label -->
  <text x="425" y="266" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="54" fill="#14B83D" letter-spacing="22">FINANCE</text>
  <!-- CALCULATE • PLAN • GROW tagline -->
  <text x="425" y="328" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="28" fill="#64748B" letter-spacing="10">CALCULATE  •  PLAN  •  GROW</text>
</svg>
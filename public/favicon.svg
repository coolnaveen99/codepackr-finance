<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CodePackr Finance greater than or equal to">
  <defs>
    <linearGradient id="codepackr-finance-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.22"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#codepackr-finance-grad)" filter="url(#soft-glow)"/>

  <!-- >= : financial future should be greater than or equal to your goals -->
  <g transform="translate(10, 13)" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,4 22,19 4,34"/>
    <line x1="30" y1="13" x2="50" y2="13"/>
    <line x1="30" y1="25" x2="50" y2="25"/>
  </g>
</svg>

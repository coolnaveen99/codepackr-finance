<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="codepackr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B52E8" />
      <stop offset="100%" stop-color="#009F88" />
    </linearGradient>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="white" flood-opacity="0.3" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#codepackr-grad)" filter="url(#inner-glow)"/>
  <circle cx="32" cy="34" r="18" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.35"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <line x1="32" y1="46" x2="32" y2="18"/>
    <polyline points="24 26 32 18 40 26"/>
  </g>
  <line x1="22" y1="48" x2="42" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>